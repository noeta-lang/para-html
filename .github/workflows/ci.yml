name: CI

# The para/html package's CI, two jobs:
#   - rust     : fmt / clippy (deny warnings) / test in each Rust crate — the `dev-native` tier-body
#                formatters (`"html"`/`"css"` reflow for `noeta fmt`) and their entry crate, each its
#                own workspace root. The formatters live behind the non-default `fmt` feature, so a
#                bare `cargo test` runs nothing; the feature build is gated explicitly.
#   - examples : the Noeta-level gate — install a pinned released `noeta`, then check + test every
#                example program.
#
# NOTE: these workflows go green once the noeta toolchain repo is published under
# github.com/noeta-lang/noeta and the ecosystem's pre-publish `file:///` git deps are flipped to it
# (tracked in the pre-alpha run-list). Until then they fail at the noeta-install step by design.

on:
  push:
    branches: [main]
  pull_request:
  # Callable as the release gate (release.yml runs the full CI before publishing).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned in lockstep with the toolchain repo's own CI (dtolnay/rust-toolchain@1.97.0 there): the
# NOETA_VERSION resolves from the org-level Actions variable of the same name (single bump
# point for every para repo), falling back to the literal. Bumping is
# deliberate — raise it here and in `release.yml` together.
env:
  CARGO_TERM_COLOR: always
  NOETA_VERSION: ${{ vars.NOETA_VERSION || 'v0.1.0' }}

jobs:
  rust:
    name: Rust crates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace-less on purpose (each crate is its own workspace root, so the composed dev
      # toolchain can adopt `native/` as a path dependency) — run per crate directory.
      - name: cargo fmt --check
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo fmt --check)
          done
      - name: cargo clippy (deny warnings)
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo clippy --all-targets -- -D warnings)
          done
      - name: cargo test
        run: |
          for crate in crates/*/ native/; do
            (cd "${crate}" && cargo test)
          done
      # The default build is the EMPTY extension (no malva, no formatters, no tests), which is what a
      # consumer links. Every formatter test lives behind `fmt`, the feature the dev toolchain builds
      # with — without this step the job would gate an empty crate and pass on anything.
      - name: cargo clippy + test --features fmt (the dev-toolchain build)
        working-directory: crates/noeta-para-html
        run: |
          cargo clippy --all-targets --features fmt -- -D warnings
          cargo test --features fmt

  examples:
    name: Examples (noeta check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: noeta check + test every example
        run: |
          for ex in examples/*/; do
            echo "== ${ex}"
            for f in "${ex}"*.noe; do
              (cd "${ex}" && noeta check "$(basename "$f")" && noeta test "$(basename "$f")")
            done
          done
