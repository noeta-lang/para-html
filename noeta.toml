[package]
name = "para/html"
# 0.6.0 rather than 0.5.1: `serves` changed meaning at the root, from "claims every path" to "claims
# the page's own three". That is what makes a root mount expressible, and it is a behavior change to
# a `pub` predicate a host framework gates on, so it takes a minor bump even though no signature
# moved. `handle` and every standalone page are unaffected.
version = "0.6.1"
# The minimum noeta this package works with; enforced at resolve time from noeta 0.2.1 on.
toolchain = ">=0.6"
license = "MIT OR Apache-2.0"
description = "HTML rendering and LiveView — server-driven UI over WebSockets with structural diffs."
keywords = ["html", "liveview", "web", "templating"]
# This package ships DEV-ONLY, trust-free native tier-body formatters (the `"html"`/`"css"` reflow for
# `noeta fmt`), in the entry crate under `native/`. Declared as `dev-native` (NOT `native`): the code
# is compiled into the dev toolchain only, contributes nothing at run time, and therefore needs NO
# `[trust] native` authorization from a consumer.
dev-native = "native"
