[package]
name = "noeta-para-html"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noeta-lang/para-html"
rust-version = "1.95"

[dependencies]
# The extension ABI, pinned to the toolchain release this package version is built against.
# The composed toolchain rewrites this git crate to the consumer's exact toolchain source via a
# `[patch]` (see `compose.rs::toolchain_patch_section`), so the `dyn Extension` vtables unify.
noeta-ext-abi = { git = "https://github.com/noeta-lang/noeta", tag = "v0.3.1" }
# The pure-Rust CSS formatter behind the `"css"` body formatter. Optional and behind the `fmt`
# feature: a default build ships an EMPTY extension (no malva, `body_formatters()` returns `&[]`),
# so a prod/consumer build links no CSS formatter. Only the dev toolchain builds `--features fmt`.
malva = { version = "0.16.0", optional = true }

[features]
# Default = empty extension: malva-free, both extensions' `body_formatters()` return `&[]`.
default = []
# The tier-body formatters (HTML reflow + CSS via malva). Enabled ONLY for the dev toolchain,
# never prod. Gating the whole heavy formatter path (and malva) here keeps the default footprint nil.
fmt = ["dep:malva"]

# To run this crate's tests standalone against an unreleased toolchain, add a local
# `[patch."https://github.com/noeta-lang/noeta"] noeta-ext-abi = { path = "…/lang/crates/noeta-ext-abi" }`
# in your own checkout (Cargo honors `[patch]` only at a workspace root; the composed toolchain
# supplies its own). Not committed — it would hardcode a machine-specific path.

# Inlined from the monorepo's [workspace.lints] (this crate is standalone).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
